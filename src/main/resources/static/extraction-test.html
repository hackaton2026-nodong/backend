<!doctype html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>OCR Extraction Test</title>
  <style>
    :root {
      --bg: #f6f7f9;
      --panel: #ffffff;
      --line: #d6dbe3;
      --text: #18202a;
      --muted: #657284;
      --accent: #176b5f;
      --accent-dark: #0f4f46;
      --warn: #9a5b00;
      --danger: #b42318;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: "Segoe UI", "Noto Sans KR", sans-serif;
      background: var(--bg);
      color: var(--text);
    }

    main {
      max-width: 1180px;
      margin: 0 auto;
      padding: 28px 20px 48px;
    }

    h1 {
      margin: 0 0 6px;
      font-size: 1.7rem;
      letter-spacing: 0;
    }

    p {
      margin: 0;
      color: var(--muted);
      line-height: 1.55;
    }

    section {
      margin-top: 18px;
      padding: 18px;
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 8px;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 14px;
    }

    .field {
      display: flex;
      flex-direction: column;
      gap: 7px;
    }

    .full { grid-column: 1 / -1; }

    details {
      grid-column: 1 / -1;
      border: 1px solid var(--line);
      border-radius: 8px;
      padding: 12px;
      background: #f9fafb;
    }

    summary {
      cursor: pointer;
      font-weight: 700;
      color: var(--muted);
    }

    .advanced-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 14px;
      margin-top: 12px;
    }

    label {
      font-size: 0.9rem;
      font-weight: 700;
    }

    input,
    textarea,
    button {
      font: inherit;
    }

    input,
    textarea {
      width: 100%;
      border: 1px solid #c9d0da;
      border-radius: 6px;
      padding: 10px 11px;
      background: #fff;
      color: var(--text);
    }

    textarea {
      min-height: 92px;
      resize: vertical;
      font-family: "Cascadia Code", "Consolas", monospace;
      font-size: 0.86rem;
    }

    .actions {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      margin-top: 14px;
    }

    button {
      border: 0;
      border-radius: 6px;
      padding: 10px 14px;
      color: #fff;
      background: var(--accent);
      font-weight: 700;
      cursor: pointer;
    }

    button.secondary { background: #516070; }
    button:disabled { opacity: 0.55; cursor: not-allowed; }

    .status {
      margin-top: 14px;
      padding: 11px 12px;
      border: 1px solid var(--line);
      border-radius: 6px;
      background: #f9fafb;
      color: var(--muted);
      line-height: 1.5;
    }

    .status.error {
      border-color: rgba(180, 35, 24, 0.35);
      background: rgba(180, 35, 24, 0.06);
      color: var(--danger);
    }

    .status.warn {
      border-color: rgba(154, 91, 0, 0.35);
      background: rgba(154, 91, 0, 0.07);
      color: var(--warn);
    }

    .cards {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: 12px;
      margin-top: 14px;
    }

    .card {
      min-height: 84px;
      padding: 13px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: #fff;
    }

    .card strong {
      display: block;
      margin-bottom: 7px;
      color: var(--muted);
      font-size: 0.78rem;
      text-transform: uppercase;
      letter-spacing: 0.04em;
    }

    .card span {
      display: block;
      white-space: pre-wrap;
      word-break: break-word;
      font-weight: 700;
      line-height: 1.4;
    }

    .raw {
      margin-top: 14px;
      padding: 12px;
      max-height: 360px;
      overflow: auto;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: #0f1720;
      color: #dce7f3;
      font-family: "Cascadia Code", "Consolas", monospace;
      font-size: 0.82rem;
      white-space: pre-wrap;
    }

    @media (max-width: 900px) {
      .grid,
      .advanced-grid,
      .cards {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>
<body>
<main>
  <header>
    <h1>OCR Extraction Test</h1>
    <p>로컬 시드 계정으로 자동 로그인한 뒤 PDF 업로드, 서버 OCR callback, 추출 필드 저장까지 확인합니다.</p>
  </header>

  <section>
    <div class="grid">
      <div class="field full">
        <label for="file">Employment Contract PDF</label>
        <input id="file" type="file" accept="application/pdf,image/*">
      </div>
      <details>
        <summary>Advanced</summary>
        <div class="advanced-grid">
          <div class="field full">
            <label for="token">Access Token</label>
            <textarea id="token" placeholder="비워두면 로컬 시드 계정으로 자동 로그인합니다."></textarea>
          </div>
          <div class="field">
            <label for="caseId">Case ID</label>
            <input id="caseId" placeholder="예: 11111111-1111-1111-1111-111111111113">
          </div>
          <div class="field">
            <label for="documentId">Document ID</label>
            <input id="documentId" placeholder="업로드 후 자동 입력 또는 기존 documentId 입력">
          </div>
          <div class="field">
            <label for="issuedAt">Issued At</label>
            <input id="issuedAt" type="date">
          </div>
          <div class="field">
            <label for="expiresAt">Expires At</label>
            <input id="expiresAt" type="date">
          </div>
        </div>
      </details>
    </div>

    <div class="actions">
      <button id="uploadButton" type="button">Upload</button>
      <button id="refreshButton" class="secondary" type="button">Refresh Extraction</button>
      <button id="analysisButton" class="secondary" type="button">Create Analysis</button>
      <button id="resetButton" class="secondary" type="button">Reset</button>
    </div>

    <div id="status" class="status">PDF를 선택하고 Upload를 누르세요. 로컬 시드 계정과 기본 케이스를 자동 사용합니다.</div>
  </section>

  <section>
    <p id="summary">추출 결과가 아직 없습니다.</p>
    <div class="cards">
      <div class="card"><strong>Status</strong><span id="extractionStatus">-</span></div>
      <div class="card"><strong>Contract Period</strong><span id="contractPeriod">-</span></div>
      <div class="card"><strong>Wage</strong><span id="wage">-</span></div>
      <div class="card"><strong>Working Hours</strong><span id="workingHours">-</span></div>
      <div class="card"><strong>Break</strong><span id="breakTime">-</span></div>
      <div class="card"><strong>Holidays</strong><span id="holidays">-</span></div>
      <div class="card"><strong>Work</strong><span id="work">-</span></div>
      <div class="card"><strong>Dormitory / Meals</strong><span id="dormitoryMeals">-</span></div>
    </div>
    <pre id="raw" class="raw">No response yet.</pre>
  </section>
</main>

<script>
  const tokenInput = document.getElementById("token");
  const caseIdInput = document.getElementById("caseId");
  const documentIdInput = document.getElementById("documentId");
  const issuedAtInput = document.getElementById("issuedAt");
  const expiresAtInput = document.getElementById("expiresAt");
  const fileInput = document.getElementById("file");
  const uploadButton = document.getElementById("uploadButton");
  const refreshButton = document.getElementById("refreshButton");
  const analysisButton = document.getElementById("analysisButton");
  const resetButton = document.getElementById("resetButton");
  const statusBox = document.getElementById("status");
  const summaryBox = document.getElementById("summary");
  const rawBox = document.getElementById("raw");
  let pollingTimer = null;
  const defaultLogin = {
    email: "minsukim@hankukmanufacturing.co.kr",
    password: "password123"
  };
  const defaultCaseId = "11111111-1111-1111-1111-111111111113";

  const today = new Date().toISOString().slice(0, 10);
  issuedAtInput.value = today;
  expiresAtInput.value = today;
  caseIdInput.value = defaultCaseId;

  function token() {
    return tokenInput.value.trim();
  }

  function documentId() {
    return documentIdInput.value.trim();
  }

  function setStatus(message, mode = "") {
    statusBox.textContent = message;
    statusBox.className = mode ? `status ${mode}` : "status";
  }

  function writeRaw(payload) {
    rawBox.textContent = JSON.stringify(payload, null, 2);
  }

  function stopPolling() {
    if (pollingTimer) {
      clearInterval(pollingTimer);
      pollingTimer = null;
    }
  }

  async function readPayload(response) {
    const payload = await response.json();
    writeRaw(payload);
    if (!response.ok || !payload.success) {
      throw new Error(payload?.error?.message || `Request failed with status ${response.status}`);
    }
    return payload.data;
  }

  async function ensureToken({ force = false } = {}) {
    if (token() && !force) {
      return token();
    }
    setStatus(`Logging in as ${defaultLogin.email}...`);
    const response = await fetch("/api/auth/login", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify(defaultLogin)
    });
    const payload = await response.json();
    if (!response.ok || !payload.success) {
      throw new Error(payload?.error?.message || `Login failed with status ${response.status}`);
    }
    tokenInput.value = payload.data.accessToken;
    return payload.data.accessToken;
  }

  function requireDocument() {
    if (!documentId()) {
      throw new Error("Document ID is required.");
    }
  }

  function text(value) {
    if (value === null || value === undefined || value === "") {
      return "-";
    }
    return String(value);
  }

  function amount(value) {
    if (value === null || value === undefined || value === "") {
      return "-";
    }
    return Number(value).toLocaleString("ko-KR") + " KRW";
  }

  function bool(value) {
    if (value === true) return "YES";
    if (value === false) return "NO";
    return "-";
  }

  function showExtraction(data) {
    const payload = data.correctedPayload && !data.correctedPayload.isNull ? data.correctedPayload : data.extractedPayload;
    const terms = payload?.contractTerms || {};
    const period = terms.contractPeriod || {};
    const wage = terms.wage || {};
    const hours = terms.workingHours || {};
    const breakTime = terms.breakTime || {};
    const holidays = terms.holidays || {};
    const work = terms.work || {};
    const dormitory = terms.dormitory || {};
    const meals = terms.meals || {};

    document.getElementById("extractionStatus").textContent = [
      data.status,
      data.reviewRequiredReason ? data.reviewRequiredReason : ""
    ].filter(Boolean).join("\n");

    document.getElementById("contractPeriod").textContent = [
      `${text(period.contractStartDate)} ~ ${text(period.contractEndDate)}`,
      `status: ${text(period.status)}`
    ].join("\n");

    document.getElementById("wage").textContent = [
      `monthly: ${amount(wage.amount)}`,
      `base: ${amount(wage.basePay)}`,
      `payment day: ${text(wage.paymentDay)}`,
      `method: ${text(wage.paymentMethod)}`
    ].join("\n");

    document.getElementById("workingHours").textContent = [
      `${text(hours.startTime)} ~ ${text(hours.endTime)}`,
      `overtime/day: ${text(hours.overtimeHoursPerDay)}`,
      `variable max: ${text(hours.maxVariableHoursPerDay)}`
    ].join("\n");

    document.getElementById("breakTime").textContent = `${text(breakTime.minutesPerDay)} minutes/day`;

    document.getElementById("holidays").textContent = [
      `Sunday: ${bool(holidays.sunday)}`,
      `Legal: ${bool(holidays.legalHoliday)}`,
      `Paid legal: ${bool(holidays.legalHolidayPaid)}`,
      `Every Saturday: ${bool(holidays.everySaturday)}`
    ].join("\n");

    document.getElementById("work").textContent = [
      `industry: ${text(work.industryCategory)}`,
      `job: ${text(work.jobCategory)}`,
      `region: ${text(work.workplaceRegion)}`
    ].join("\n");

    document.getElementById("dormitoryMeals").textContent = [
      `dormitory: ${bool(dormitory.provided)}`,
      `housing cost: ${amount(dormitory.deductionAmount)}`,
      `meals: ${bool(meals.provided)}`,
      `meal cost: ${amount(meals.deductionAmount)}`
    ].join("\n");

    summaryBox.textContent = `documentId=${data.documentId}, source=${data.sourceEngine}, aiPayloadHash=${data.aiPayloadHash || "-"}`;
  }

  async function upload() {
    try {
      const accessToken = await ensureToken({ force: true });
      const caseId = caseIdInput.value.trim();
      const file = fileInput.files[0];
      if (!caseId || !issuedAtInput.value || !expiresAtInput.value) {
        throw new Error("Case ID and dates are required.");
      }
      if (!file) {
        throw new Error("PDF is required.");
      }

      uploadButton.disabled = true;
      setStatus("Uploading document and requesting server OCR...");

      const formData = new FormData();
      formData.append("file", file);
      formData.append("documentType", "EMPLOYMENT_CONTRACT");
      formData.append("issuedAt", issuedAtInput.value);
      formData.append("expiresAt", expiresAtInput.value);

      const response = await fetch(`/api/cases/${encodeURIComponent(caseId)}/documents`, {
        method: "POST",
        headers: { Authorization: `Bearer ${accessToken}` },
        body: formData
      });
      const data = await readPayload(response);
      documentIdInput.value = data.id;
      setStatus(`Upload completed. documentId=${data.id}. OCR worker callback을 기다리는 중입니다.`);
      startPolling();
    } catch (error) {
      setStatus(error.message, "error");
    } finally {
      uploadButton.disabled = false;
    }
  }

  async function refreshExtraction({ silent = false } = {}) {
    try {
      const accessToken = await ensureToken();
      requireDocument();
      const response = await fetch(`/api/documents/${encodeURIComponent(documentId())}/extraction`, {
        headers: { Authorization: `Bearer ${accessToken}` }
      });
      const data = await readPayload(response);
      showExtraction(data);
      setStatus(data.status === "PENDING" ? "OCR is still pending." : "Extraction loaded.", data.status === "NEEDS_REVIEW" ? "warn" : "");
      if (data.status !== "PENDING") {
        stopPolling();
      }
      return data;
    } catch (error) {
      if (!silent) {
        setStatus(error.message, "error");
      }
      return null;
    }
  }

  function startPolling() {
    stopPolling();
    let remaining = 20;
    pollingTimer = setInterval(async () => {
      remaining -= 1;
      const data = await refreshExtraction({ silent: true });
      if (!data && remaining <= 0) {
        stopPolling();
        setStatus("OCR result was not available within the polling window. Refresh Extraction으로 다시 확인하세요.", "warn");
        return;
      }
      if (data?.status === "PENDING" && remaining <= 0) {
        stopPolling();
        setStatus("OCR is still pending. OCR worker 상태를 확인한 뒤 Refresh Extraction을 누르세요.", "warn");
      }
    }, 3000);
  }

  async function createAnalysis() {
    try {
      const accessToken = await ensureToken();
      requireDocument();
      const response = await fetch(`/api/documents/${encodeURIComponent(documentId())}/analysis`, {
        method: "POST",
        headers: { Authorization: `Bearer ${accessToken}` }
      });
      const data = await readPayload(response);
      setStatus(`Analysis completed. extractedTextHash=${data.extractedTextHash}`);
    } catch (error) {
      setStatus(error.message, "error");
    }
  }

  function reset() {
    stopPolling();
    caseIdInput.value = "";
    caseIdInput.value = defaultCaseId;
    documentIdInput.value = "";
    fileInput.value = "";
    summaryBox.textContent = "추출 결과가 아직 없습니다.";
    rawBox.textContent = "No response yet.";
    ["extractionStatus", "contractPeriod", "wage", "workingHours", "breakTime", "holidays", "work", "dormitoryMeals"]
      .forEach((id) => document.getElementById(id).textContent = "-");
    setStatus("PDF를 선택하고 Upload를 누르세요. 로컬 시드 계정과 기본 케이스를 자동 사용합니다.");
  }

  uploadButton.addEventListener("click", upload);
  refreshButton.addEventListener("click", refreshExtraction);
  analysisButton.addEventListener("click", createAnalysis);
  resetButton.addEventListener("click", reset);
</script>
</body>
</html>
