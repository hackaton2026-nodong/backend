spring:
  application:
    name: backend
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: ${JPA_DDL_AUTO:validate}
    properties:
      hibernate:
        format_sql: true
  sql:
    init:
      mode: never
  data:
    redis:
      repositories:
        enabled: false

springdoc:
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: alpha
    tags-sorter: alpha
  api-docs:
    path: /v3/api-docs

server:
  port: ${SERVER_PORT:8080}

jwt:
  secret: ${JWT_SECRET:change-me-to-a-secure-secret-key-for-jwt-signing}
  access-token-expiration-seconds: ${JWT_ACCESS_TOKEN_EXPIRATION_SECONDS:3600}
  refresh-token-expiration-seconds: ${JWT_REFRESH_TOKEN_EXPIRATION_SECONDS:1209600}

app:
  document:
    storage-root: ${DOCUMENT_STORAGE_ROOT:./storage/documents}
    ocr:
      enabled: ${DOCUMENT_OCR_ENABLED:false}
      endpoint: ${DOCUMENT_OCR_ENDPOINT:}
      callback-token: ${DOCUMENT_OCR_CALLBACK_TOKEN:}
      callback-base-url: ${DOCUMENT_OCR_CALLBACK_BASE_URL:}
    blockchain:
      chain-id: ${DOCUMENT_CHAIN_ID:11155111}
      contract-address: ${DOCUMENT_CONTRACT_ADDRESS:0x0000000000000000000000000000000000000000}
      domain-name: ${DOCUMENT_DOMAIN_NAME:KWorkerHarmonyDocument}
      domain-version: ${DOCUMENT_DOMAIN_VERSION:1}
      signature-ttl-seconds: ${DOCUMENT_SIGNATURE_TTL_SECONDS:900}
