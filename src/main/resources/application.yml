spring:
  application:
    name: backend
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: ${JPA_DDL_AUTO:validate}
    properties:
      hibernate:
        format_sql: true
  sql:
    init:
      mode: never
  data:
    redis:
      repositories:
        enabled: false

springdoc:
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: alpha
    tags-sorter: alpha
  api-docs:
    path: /v3/api-docs

server:
  port: ${SERVER_PORT:8080}

jwt:
  secret: ${JWT_SECRET:change-me-to-a-secure-secret-key-for-jwt-signing}
  access-token-expiration-seconds: ${JWT_ACCESS_TOKEN_EXPIRATION_SECONDS:3600}
  refresh-token-expiration-seconds: ${JWT_REFRESH_TOKEN_EXPIRATION_SECONDS:1209600}

app:
  cors:
    allowed-origins: ${APP_CORS_ALLOWED_ORIGINS:http://localhost:5173,http://127.0.0.1:5173,http://localhost:5174,http://127.0.0.1:5174}
    allowed-methods: ${APP_CORS_ALLOWED_METHODS:GET,POST,PUT,PATCH,DELETE,OPTIONS}
    allowed-headers: ${APP_CORS_ALLOWED_HEADERS:*}
    exposed-headers: ${APP_CORS_EXPOSED_HEADERS:Authorization}
    allow-credentials: ${APP_CORS_ALLOW_CREDENTIALS:true}
    max-age-seconds: ${APP_CORS_MAX_AGE_SECONDS:3600}
  document:
    storage-root: ${DOCUMENT_STORAGE_ROOT:./storage/documents}
    ocr:
      enabled: ${DOCUMENT_OCR_ENABLED:false}
      endpoint: ${DOCUMENT_OCR_ENDPOINT:}
      callback-token: ${DOCUMENT_OCR_CALLBACK_TOKEN:}
      callback-base-url: ${DOCUMENT_OCR_CALLBACK_BASE_URL:}
    ai:
      enabled: ${DOCUMENT_AI_ENABLED:false}
      endpoint: ${DOCUMENT_AI_ENDPOINT:}
      health-endpoint: ${DOCUMENT_AI_HEALTH_ENDPOINT:http://localhost:8000/health}
      health-timeout-millis: ${DOCUMENT_AI_HEALTH_TIMEOUT_MILLIS:2000}
    blockchain:
      chain-id: ${DOCUMENT_CHAIN_ID:11155111}
      contract-address: ${DOCUMENT_CONTRACT_ADDRESS:0x0000000000000000000000000000000000000000}
      domain-name: ${DOCUMENT_DOMAIN_NAME:KWorkerHarmonyDocument}
      domain-version: ${DOCUMENT_DOMAIN_VERSION:1}
      signature-ttl-seconds: ${DOCUMENT_SIGNATURE_TTL_SECONDS:900}
